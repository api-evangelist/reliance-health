name: Reliance Health
description: 'Reliance Health (formerly RelianceHMO) is a healthtech company making quality healthcare
  accessible and affordable across emerging markets, with operations centered in Nigeria and expanding
  across Africa and the Middle East. It offers employer-sponsored and individual health plans covering
  preventative, emergency, and chronic care, telemedicine and doctor consultations through its mobile
  app, and a network of 3,800+ healthcare partners (hospitals, clinics, pharmacies, and diagnostic
  centers). Reliance Health combines insurance, its own clinics, and technology to deliver an
  end-to-end care experience for businesses and their employees. As of this enrichment pass the company
  publishes no public developer API, developer portal, SDKs, or OpenAPI surface; the reliancehmo.com
  application backend (api.reliancehmo.com) is an internal web-app origin, not a documented public API.'
